<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Keyvane sign-in</title>
  <!--
    OAuth redirect page for the Keyvane web app (Google Drive, Dropbox, OneDrive).
    Hands the callback URL back to the app window via postMessage, restricted
    to this page's own origin, as flutter_web_auth_2 expects. Register this
    page's full URL as the web redirect URI with each provider
    (docs/setup/storage-oauth.md).
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; color: #e6ebf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0; color: #9aa6c0; }
  </style>
</head>
<body>
  <main>
    <h1>Back to Keyvane</h1>
    <p>Finishing sign-in. If this window stays open, you can close it.</p>
  </main>
  <script src="auth.js"></script>
</body>
</html>
